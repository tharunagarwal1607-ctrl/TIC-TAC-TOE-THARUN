<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe AI</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game-container">
        <h1>❌ Tic-Tac-Toe ⭕</h1>
        <p class="subtitle">Play against the Computer AI</p>

        <div id="status">Your turn! Choose a square.</div>

        <div class="board" id="board">
            <button class="cell" data-index="0"></button>
            <button class="cell" data-index="1"></button>
            <button class="cell" data-index="2"></button>

            <button class="cell" data-index="3"></button>
            <button class="cell" data-index="4"></button>
            <button class="cell" data-index="5"></button>

            <button class="cell" data-index="6"></button>
            <button class="cell" data-index="7"></button>
            <button class="cell" data-index="8"></button>
        </div>

        <button id="restartBtn">🔄 New Game</button>

        <div class="score">
            <span>You: <b id="playerScore">0</b></span>
            <span>Computer: <b id="computerScore">0</b></span>
            <span>Draws: <b id="drawScore">0</b></span>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
